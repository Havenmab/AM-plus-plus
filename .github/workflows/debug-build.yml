name: Debug build

on:
  workflow_dispatch:
  push:
    branches: [ ci/lyrics-build ]

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify pinned glass renderer
        run: python3 scripts/verify-glass-reference.py

      - name: Build and test debug
        run: |
          chmod +x gradlew
          ./gradlew test :app:assembleDebug --no-daemon

      - name: Show APK identity
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging "$APK" | head -3

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AM-plus-plus-debug-citest
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error