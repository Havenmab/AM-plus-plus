name: Build (private)

# 自用私有仓库：只出 debug APK，不碰 release 签名。
# 触发：push / pull_request / 手动。
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Static gates
        run: |
          python3 scripts/verify-glass-reference.py
          python3 scripts/verify-architecture.py
          python3 scripts/verify-profile-data.py
          python3 -m unittest discover -s scripts/tests
          python3 scripts/amll_to_apple_ttml.py --selftest

      - name: Build plugin fixture
        run: |
          chmod +x gradlew
          python3 scripts/build-plugin-example.py

      - name: Test and assemble debug
        run: |
          ./gradlew test :app:assembleDebug -PpluginFixture="$PWD/build/plugin-example/basic-plugin.zip" --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AM-plus-plus-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
